name: Import portfolio source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source folders
        run: |
          test -f portfolio-source.zip
          python3 -m zipfile -e portfolio-source.zip .
          rm portfolio-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html project.html README.md assets css js portfolio-source.zip
          git commit -m "Import complete portfolio source and assets"
          git push
